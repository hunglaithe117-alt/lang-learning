services:
  postgres:
    image: postgres:16
    container_name: lang-learning-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lang-learning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lang-learning']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: lang-learning-server
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - '${NESTJS_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lang-learning?schema=public

  llm-service:
    container_name: lang-learning-llm
    build:
      context: ./services/llm-service
      dockerfile: Dockerfile
    ports:
      - '${LLM_SERVICE_PORT:-8000}:8000'
    env_file:
      - .env
    environment:
      - NESTJS_SERVER_URL=http://server:3000
    volumes:
      - llm_chroma_data:/app/chroma_data
      - llm_uploads:/app/uploads

volumes:
  postgres_data:
    name: lang-learning-db-data
  llm_chroma_data:
    name: lang-learning-chroma-data
  llm_uploads:
    name: lang-learning-uploads
